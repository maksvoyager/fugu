<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#087ec4" />
    <meta name="description" content="Спокойная подводная merge-игра про рыбок фугу" />
    <title>Фугу: вверх!</title>
    <link rel="stylesheet" href="./src/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet" />
  </head>
  <body>
    <main class="app-shell">
      <section id="game-wrap" class="game-wrap" aria-label="Подводное игровое поле">
        <div class="water-rays" aria-hidden="true"></div>
        <div class="ambient-bubbles" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
        <div id="game-container"></div>
        <div class="surface-glow" aria-hidden="true"></div>

        <header class="hud">
          <div class="hud-stat next-bubble" data-game-ui>
            <span class="hud-label">СЛЕДУЮЩАЯ</span>
            <div id="next-fruit" class="next-fruit" aria-label="Следующая рыбка"></div>
          </div>

          <div class="hud-stat score-bubble" data-game-ui aria-live="polite">
            <span class="hud-label">СЧЁТ</span>
            <strong id="score">0</strong>
          </div>

          <div class="hud-stat best-bubble" data-game-ui aria-live="polite">
            <span class="hud-label">ЛУЧШИЙ</span>
            <strong id="hud-best-score">0</strong>
          </div>

          <button id="pause-button" class="pause-button bubble-button" type="button" aria-label="Пауза">
            <span></span><span></span>
          </button>

        </header>

        <div id="warning" class="warning" role="status">Рыбкам становится тесно</div>

        <div id="progression" class="progression" data-game-ui aria-label="Открытые уровни рыбок"></div>
        <p id="control-hint" class="hint">Удерживайте и двигайте · отпустите, чтобы запустить</p>

        <div id="pause-modal" class="modal" hidden>
          <div class="modal-card bubble-panel">
            <span class="modal-kicker">НЕБОЛЬШАЯ ПЕРЕДЫШКА</span>
            <h2>ПАУЗА</h2>
            <button id="continue-button" class="modal-button bubble-button" type="button">Продолжить</button>
            <button id="pause-restart-button" class="modal-button bubble-button secondary" type="button">Начать заново</button>
          </div>
        </div>

        <div id="game-over" class="modal" hidden>
          <div class="modal-card bubble-panel game-over-card">
            <span class="modal-kicker">ПОВЕРХНОСТЬ ЗАПОЛНЕНА</span>
            <h2>ИГРА ОКОНЧЕНА</h2>
            <div class="results">
              <div><span>СЧЁТ</span><strong id="final-score">0</strong></div>
              <div><span>ЛУЧШИЙ</span><strong id="best-score">0</strong></div>
            </div>
            <button id="restart-button" class="modal-button bubble-button accent" type="button">Играть снова</button>
          </div>
        </div>
      </section>
    </main>

    <script src="./vendor/phaser.min.js"></script>
    <script type="module" src="./src/game.js"></script>
  </body>
</html>
